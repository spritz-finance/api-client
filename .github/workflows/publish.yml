name: Publish

# Publishes whatever version package.json on main declares, if npm doesn't
# have it yet. Merging the changesets "Version Packages" PR bumps the version,
# so that merge is what releases. The production environment only accepts
# main, so this never publishes from another branch or ref.

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check whether this version is already published
              id: version
              run: |
                  name=$(node -p "require('./package.json').name")
                  version=$(node -p "require('./package.json').version")
                  if npm view "${name}@${version}" version >/dev/null 2>&1; then
                      echo "${name}@${version} is already on npm; nothing to publish"
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "Publishing ${name}@${version}"
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Setup Node
              if: steps.version.outputs.publish == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: '22.14.0'
                  cache: 'yarn'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              if: steps.version.outputs.publish == 'true'
              run: yarn install --frozen-lockfile

            - name: Upgrade npm for trusted publishing
              if: steps.version.outputs.publish == 'true'
              run: npm install --global npm@^11.5.1

            - name: Show tool versions
              if: steps.version.outputs.publish == 'true'
              run: |
                  node --version
                  npm --version
                  yarn --version

            - name: Verify
              if: steps.version.outputs.publish == 'true'
              run: yarn agent:check

            - name: Publish to npm
              if: steps.version.outputs.publish == 'true'
              run: yarn release
