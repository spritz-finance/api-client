name: Maintenance Publish

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Maintenance branch (e.g. release/0.7) or commit SHA to publish from
                required: true
            dist-tag:
                description: |
                    npm dist-tag for this maintenance line (e.g. legacy-0.7, legacy-0.8). Must NOT be 'latest'
                    (use the main Publish workflow for that) and must NOT parse as a SemVer range — that
                    rules out bare versions like '0.7' or '0.7.x'. Prefix or suffix to avoid the SemVer parser.
                required: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency: ${{ github.workflow }}-${{ inputs.ref }}

permissions:
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Refuse 'latest' dist-tag
              if: inputs.dist-tag == 'latest'
              run: |
                  echo "::error::Use the standard Publish workflow to publish under the 'latest' dist-tag."
                  exit 1

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22.14.0'
                  cache: 'yarn'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Upgrade npm for trusted publishing
              run: npm install --global npm@^11.5.1

            - name: Show tool versions
              run: |
                  node --version
                  npm --version
                  yarn --version

            - name: Verify
              run: yarn agent:check

            - name: Publish to npm
              run: npx changeset publish --tag ${{ inputs.dist-tag }}

            - name: Push git tags
              run: git push --tags
